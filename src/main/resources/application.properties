spring.application.name=expense-api

spring.datasource.url =${DB_URL}
spring.datasource.username =${DB_USER}
spring.datasource.password =${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto =validate
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

jwt.secret =${JWT_SECRET}

# Logging levels
logging.level.root=INFO
logging.level.com.expensemanagement.expense_api=DEBUG
logging.level.org.springframework.security=INFO

# Log file
logging.file.name =logs/expense-management.log

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

## Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application Information
management.info.env.enabled = true
info.app.name=Expense Management System
info.app.description=REST API for managing expenses
info.app.version=1.0.0

# Database Migration Management
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

